<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoldBot — прототип</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --page-bg: #e9e9ec;
    --app-bg: #ffffff;
    --group-bg: #f7f7f7;
    --card-bg: #ffffff;
    --stroke: rgba(0,0,0,0.06);
    --text-primary: #000000;
    --text-value: #3f3f41;
    --text-secondary: #8a8a8e;
    --positive: #009345;
    --negative: #f05824;
    --radius-xxl: 20px;
    --radius-xxxl: 24px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: var(--font);
    background: var(--page-bg);
  }
  body {
    display: flex;
    align-items: stretch;
    justify-content: center;
    min-height: 100%;
  }

  .phone {
    width: 100%;
    max-width: 560px;
    height: 100dvh;
    background: var(--app-bg);
    display: flex;
    flex-direction: column;
  }

  /* header — transparent floating overlay, content scrolls underneath it */
  .content-area {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 12px;
    background: transparent;
    pointer-events: none;
    z-index: 5;
  }
  .header .avatar,
  .header .close-btn {
    pointer-events: auto;
  }
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff5bb0 0%, #7b3ff2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .avatar svg { width: 24px; height: 24px; }
  .close-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    flex: 0 0 auto;
    transition: transform .15s ease;
  }
  .close-btn:active { transform: scale(0.9); }

  /* feed */
  .feed {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 76px 0 108px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .feed::-webkit-scrollbar { width: 0; }

  /* a bot "turn": chart widget + its own stat widgets, appended as one block in the feed */
  .widget-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 0 0 auto;
    background: var(--group-bg);
    border-radius: var(--radius-xxl);
    padding: 16px;
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* chart card */
  .chart-card {
    background: var(--card-bg);
    border-radius: var(--radius-xxl);
    overflow: hidden;
    position: relative;
    height: 386px;
    flex: 0 0 auto;
  }
  .chart-card.expanded { height: 435px; }
  .chart-card canvas { display: block; width: 100%; height: 100%; }
  /* snapshot state — only the newest widget stays fully live, older ones dim and get a timestamp */
  .widget-group.snapshot {
    opacity: 0.45;
    transition: opacity .3s ease;
  }
  .snapshot-label {
    position: absolute;
    left: 12px;
    top: 12px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 16px;
    height: 224px;
    flex: 0 0 auto;
  }
  .stat-card {
    background: var(--card-bg);
    border-radius: var(--radius-xxl);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .stat-card.tall { grid-row: 1 / span 2; }
  .stat-value {
    font-size: 24px;
    font-weight: 590;
    color: var(--text-value);
    line-height: 1.2;
  }
  .stat-time {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* chat bubbles */
  .msg-row { display: flex; flex: 0 0 auto; padding: 0 16px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 12px;
    border-radius: 16px;
    font-size: 16px;
    line-height: 24px;
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble.bot-bubble { max-width: 88%; }
  .bubble.user-bubble {
    background: #f7f7f7;
    color: #000;
    text-align: right;
  }
  .bubble.thinking-bubble {
    background: transparent;
    color: #000;
    opacity: 0.35;
    padding: 12px 0;
  }
  .bubble.bot-bubble {
    background: #f7f7f7;
    color: #000;
    text-align: left;
  }
  .bubble.suggestion-chip {
    background: #f7f7f7;
    color: #000;
    text-align: right;
    border: none;
    font-family: var(--font);
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .bubble.suggestion-chip:active { transform: scale(0.97); background: #eeeeee; }

  /* input bar — transparent floating overlay, no background plate behind it */
  .input-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 32px calc(20px + env(safe-area-inset-bottom, 0px));
    background: transparent;
    pointer-events: none;
    z-index: 6;
    transition: padding-bottom .2s ease;
  }
  /* Figma: container bottom padding shrinks from 20px to 8px while typing (keyboard is right there) */
  .input-bar:has(.chat-box:focus-within) {
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .input-bar::before {
    content: '';
    position: absolute;
    inset: -48px 0 0 0;
    background: linear-gradient(to bottom, rgba(247,247,247,0) 0%, var(--app-bg) 65%);
    pointer-events: none;
    z-index: -1;
  }
  .input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    pointer-events: none;
    position: relative;
  }
  .chat-box, .flash-btn { pointer-events: auto; }

  /* idle state — exact Figma spec: 205x64, 16px padding, 200px radius */
  .chat-box {
    flex: 0 0 205px;
    width: 205px;
    height: 64px;
    background: var(--card-bg);
    border-radius: 200px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    transition: width .25s cubic-bezier(.4,0,.2,1), height .25s cubic-bezier(.4,0,.2,1),
                padding .25s cubic-bezier(.4,0,.2,1), box-shadow .25s ease, flex .25s ease;
  }
  /* focused/typing state — exact Figma spec: full width x 80, 20px padding */
  .chat-box:focus-within {
    flex: 1 1 auto;
    width: auto;
    height: 80px;
    padding: 0 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.05);
  }

  /* "show last widget again" button — only visible after a text-only reply */
  .flash-btn {
    flex: 0 0 auto;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: transform .15s ease, opacity .2s ease;
  }
  .flash-btn.visible { display: flex; }
  .flash-btn:active { transform: scale(0.92); }
  .chat-box:focus-within ~ .flash-btn { display: none; }
  .flash-btn svg { width: 24px; height: 24px; }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    cursor: pointer;
    color: #000;
    transition: width .25s ease, height .25s ease;
  }
  .icon-btn svg { width: 16px; height: 16px; transition: width .25s ease, height .25s ease; }
  .chat-box:focus-within .icon-btn { width: 40px; height: 40px; }
  .chat-box:focus-within .icon-btn svg { width: 24px; height: 24px; }

  .icon-btn.mic-btn {
    background: #f7f7f7;
    transition: background .15s ease, transform .15s ease, width .25s ease, height .25s ease;
  }
  .mic-btn .send-icon { display: none; }
  .mic-btn.has-text .mic-icon { display: none; }
  .mic-btn.has-text .send-icon { display: block; }
  .mic-btn.has-text { background: #000; }
  .mic-btn.has-text .send-icon path { stroke: #fff; }
  .icon-btn.mic-btn.listening {
    background: var(--negative);
    color: #fff;
    transform: scale(1.08);
  }
  .chat-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    font-family: var(--font);
    color: #000;
    min-width: 0;
    transition: font-size .25s ease;
  }
  .chat-input::placeholder { color: rgba(0,0,0,0.35); }
  .chat-box:focus-within .chat-input { font-size: 18px; }

</style>
</head>
<body>

<div class="phone">

    <div class="content-area">
      <div class="header">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 8V16L12 22L22 16V8L12 2Z" fill="white" fill-opacity="0.9"/></svg>
        </div>
        <button class="close-btn" id="closeBtn" title="Сбросить прототип">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1L13 13M13 1L1 13" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="feed" id="feed"></div>

      <div class="input-bar">
        <div class="input-row">
          <div class="chat-box" id="chatBox">
            <button class="icon-btn plus-btn" id="plusBtn">
              <svg viewBox="0 0 16 16" fill="none"><path d="M8 1V15M1 8H15" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <input class="chat-input" id="chatInput" type="text" placeholder="Write..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button class="icon-btn mic-btn" id="micBtn">
              <svg class="mic-icon" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="1" width="5" height="8" rx="2.5" stroke="#000" stroke-width="1.3"/><path d="M3 8C3 10.76 5.24 13 8 13C10.76 13 13 10.76 13 8" stroke="#000" stroke-width="1.3" stroke-linecap="round"/><path d="M8 13V15.5" stroke="#000" stroke-width="1.3" stroke-linecap="round"/></svg>
              <svg class="send-icon" viewBox="0 0 16 16" fill="none"><path d="M8 13.5V2.5" stroke="#000" stroke-width="1.4" stroke-linecap="round"/><path d="M3.5 7L8 2.5L12.5 7" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <button class="flash-btn" id="flashBtn" title="Показать виджет снова">
            <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14H11L10 22L20 9H13L13 2Z" stroke="#000" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  const feed = document.getElementById('feed');
  const chatInput = document.getElementById('chatInput');
  const micBtn = document.getElementById('micBtn');
  const plusBtn = document.getElementById('plusBtn');
  const closeBtn = document.getElementById('closeBtn');
  const flashBtn = document.getElementById('flashBtn');

  function fmtTime() {
    const now = new Date();
    let h = now.getHours() % 12; if (h === 0) h = 12;
    const m = String(now.getMinutes()).padStart(2, '0');
    const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
    return `${h}:${m} ${ampm}`;
  }

  function fmtSnapshotStamp(date) {
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    const mo = String(date.getMonth() + 1).padStart(2, '0');
    const yy = date.getFullYear();
    return `по состоянию на ${hh}:${mm}, ${dd}.${mo}.${yy}`;
  }

  // only the most recently added widget stays "live" — everything before it becomes a dimmed snapshot
  function snapshotExistingWidgets() {
    feed.querySelectorAll('.widget-group:not(.snapshot)').forEach((group) => {
      group.classList.add('snapshot');
      const createdAt = group._createdAt || new Date();
      const chartCard = group.querySelector('.chart-card');
      if (chartCard && !chartCard.querySelector('.snapshot-label')) {
        const label = document.createElement('div');
        label.className = 'snapshot-label';
        label.textContent = fmtSnapshotStamp(createdAt);
        chartCard.appendChild(label);
      }
    });
  }

  function randCandles(n) {
    let price = 2380 + Math.random() * 20;
    const data = [];
    for (let i = 0; i < n; i++) {
      const open = price;
      const change = (Math.random() - 0.48) * 6;
      const close = open + change;
      const high = Math.max(open, close) + Math.random() * 3;
      const low = Math.min(open, close) - Math.random() * 3;
      data.push({ open, close, high, low });
      price = close;
    }
    return data;
  }

  function drawChart(canvas, expanded, dataOverride) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = rect.width, h = rect.height;
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    const rows = expanded ? 6 : 4;
    for (let i = 1; i < rows; i++) {
      const y = (h / rows) * i;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    const cols = 8;
    for (let i = 1; i < cols; i++) {
      const x = (w / cols) * i;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }

    const n = expanded ? 34 : 24;
    const data = dataOverride || randCandles(n);
    const prices = data.flatMap(d => [d.high, d.low]);
    const max = Math.max(...prices), min = Math.min(...prices);
    const pad = (max - min) * 0.15 || 1;
    const top = max + pad, bottom = min - pad;
    const y = v => h - ((v - bottom) / (top - bottom)) * h;

    const slotW = w / n;
    const bodyW = Math.max(2, slotW * 0.55);

    data.forEach((d, i) => {
      const cx = slotW * i + slotW / 2;
      const up = d.close >= d.open;
      ctx.strokeStyle = up ? '#009345' : '#f05824';
      ctx.fillStyle = up ? '#009345' : '#f05824';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, y(d.high));
      ctx.lineTo(cx, y(d.low));
      ctx.stroke();
      const yOpen = y(d.open), yClose = y(d.close);
      const top2 = Math.min(yOpen, yClose);
      const bh = Math.max(2, Math.abs(yClose - yOpen));
      ctx.fillRect(cx - bodyW / 2, top2, bodyW, bh);
    });

    const last = data[data.length - 1].close;
    const first = data[0].open;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,147,69,0.6)';
    ctx.beginPath(); ctx.moveTo(0, y(Math.max(first, last))); ctx.lineTo(w, y(Math.max(first, last))); ctx.stroke();
    ctx.strokeStyle = 'rgba(240,88,36,0.6)';
    ctx.beginPath(); ctx.moveTo(0, y(Math.min(first, last))); ctx.lineTo(w, y(Math.min(first, last))); ctx.stroke();
    return data;
  }

  // remembers the most recently shown widget so the flash button can bring back the exact same one
  let lastWidgetState = null; // { expanded, data }

  // builds one full bot "turn": a chart widget + its own stat widgets — appended as a new block, never mutating previous ones
  function buildWidgetGroup(expanded, dataOverride) {
    snapshotExistingWidgets(); // whatever was live becomes a dimmed snapshot the moment a new widget appears

    const group = document.createElement('div');
    group.className = 'widget-group';
    group._createdAt = new Date();

    const chartCard = document.createElement('div');
    chartCard.className = 'chart-card' + (expanded ? ' expanded' : '');
    chartCard.innerHTML = `<canvas></canvas>`;
    group.appendChild(chartCard);

    const statsGrid = document.createElement('div');
    statsGrid.className = 'stats-grid';
    const time = fmtTime();
    statsGrid.innerHTML = `
      <div class="stat-card tall">
        <div class="stat-value">5 83dsf</div>
        <div class="stat-time">${time}</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">5 83dsf</div>
        <div class="stat-time">${time}</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">5 83dsf</div>
        <div class="stat-time">${time}</div>
      </div>
    `;
    group.appendChild(statsGrid);

    feed.appendChild(group);
    const usedData = drawChart(chartCard.querySelector('canvas'), expanded, dataOverride);
    lastWidgetState = { expanded, data: usedData };
    return group;
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble user-bubble">${text}</div>`;
    feed.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="bubble thinking-bubble">... думаю</div>`;
    feed.appendChild(row);
    scrollToBottom();
    return row;
  }

  function normalize(text) {
    return text.trim().toLowerCase().replace(/[?!.,]+$/g, '');
  }

  function addBotText(text) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="bubble bot-bubble">${text}</div>`;
    feed.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addSuggestionChip(label, onTap) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const btn = document.createElement('button');
    btn.className = 'bubble suggestion-chip';
    btn.textContent = label;
    btn.addEventListener('click', () => { row.remove(); onTap(); });
    row.appendChild(btn);
    feed.appendChild(row);
    scrollToBottom();
    return row;
  }

  // special text-only branch: "объясни что сделал" gets a plain-text answer instead of a widget
  const EXPLAIN_PHRASE = 'объясни';

  function respond(thinkingRow, rawText) {
    setTimeout(() => {
      thinkingRow.remove();
      if (normalize(rawText).includes(EXPLAIN_PHRASE)) {
        addBotText(`
          <p>Проанализировал EURUSD за последние 4 часа. Пара консолидируется в диапазоне 1.0820–1.0865, объёмы на попытках пробоя вверх слабые, а RSI на 1H застрял около 52 — явного импульса ни в одну сторону пока нет.</p>
          <p>Рабочий сценарий: жду закрепления выше 1.0865 на закрытии 1H-свечи — тогда вход в лонг с целью 1.0910 (ближайший недельный уровень сопротивления) и стопом под 1.0805, за нижней границей диапазона. RR получается около 2.1, что укладывается в план.</p>
          <p>Альтернативный сценарий: если цена уйдёт ниже 1.0800, разворачиваю логику на шорт с целью 1.0740 — там проходит 50-дневная скользящая и предыдущий локальный минимум.</p>
          <p>Риск на сделку — не больше 1% депозита, размер лота подбираю под стоп в ~60 пунктов. Буду держать позицию до пробоя одного из уровней или до завтрашних данных по инфляции США в 15:30 — событие может резко сдвинуть волатильность.</p>
        `);
        flashBtn.classList.add('visible'); // tap it to bring the last widget back
      } else {
        flashBtn.classList.remove('visible');
        buildWidgetGroup(true); // bot answers with a brand-new widget, appended below — old ones stay in history above
      }
      scrollToBottom();
    }, 1300);
  }

  function sendMessage(text) {
    if (!text || !text.trim()) return;
    addUserMessage(text.trim());
    chatInput.value = '';
    micBtn.classList.remove('has-text');
    chatInput.blur(); // collapse the keyboard on send
    const thinkingRow = addThinking();
    respond(thinkingRow, text);
  }

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(chatInput.value);
  });

  chatInput.addEventListener('input', () => {
    micBtn.classList.toggle('has-text', chatInput.value.trim().length > 0);
  });

  // Guarded so it fires reliably from a mouse click (desktop/preview) AND a touch tap,
  // including while the input is focused/active — preventDefault only on touch/pen keeps the
  // input from blurring mid-tap (which used to shrink the chat-box and move the button out from
  // under the finger before 'click' could fire), while plain mouse clicks still work normally.
  let micTapHandled = false;
  function handleMicTap() {
    if (micTapHandled) return;
    micTapHandled = true;
    setTimeout(() => { micTapHandled = false; }, 400);

    if (chatInput.value.trim()) { sendMessage(chatInput.value); return; }
    micBtn.classList.add('listening');
    chatInput.placeholder = 'Слушаю...';
    setTimeout(() => {
      micBtn.classList.remove('listening');
      chatInput.placeholder = 'Write...';
      sendMessage('Добавь параметр такой то');
    }, 1400);
  }
  micBtn.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' || e.pointerType === 'pen') e.preventDefault();
    handleMicTap();
  });
  micBtn.addEventListener('click', handleMicTap);

  plusBtn.addEventListener('click', () => chatInput.focus());

  function resetPrototype() {
    feed.innerHTML = '';
    buildWidgetGroup(false); // screen 1: opened the bot — initial widget already in history
    chatInput.value = '';
    flashBtn.classList.remove('visible');
  }
  closeBtn.addEventListener('click', resetPrototype);

  flashBtn.addEventListener('click', () => {
    if (!lastWidgetState) return;
    buildWidgetGroup(lastWidgetState.expanded, lastWidgetState.data); // show the exact same last widget again
    flashBtn.classList.remove('visible');
    scrollToBottom();
  });

  window.addEventListener('resize', () => {
    feed.querySelectorAll('.chart-card').forEach(card => {
      drawChart(card.querySelector('canvas'), card.classList.contains('expanded'));
    });
  });

  resetPrototype();
})();
</script>
</body>
</html>
